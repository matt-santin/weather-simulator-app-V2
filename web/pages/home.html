<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Simulator</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/home.js"></script>
  </head>
  <!-- The sky belongs to this page. The results page is a strip of cards and a
       sunset behind them would fight them for attention. -->
  <body class="home">
    <a class="skip" href="#search" data-text="site.skip"></a>

    <!--
      The sky, and the heat coming off it.

      A layer of its own rather than the body's background, because the shimmer
      is an SVG filter and a filter applies to an element whole: put on the body
      it would ripple the heading, the form and the warning along with the
      gradient, and a wobbling date field is not a design. Here it reaches the
      sky and nothing else.

      Decorative through and through — `aria-hidden`, and nothing inside it.
    -->
    <div class="sky" aria-hidden="true"></div>

    <!-- The way to the maps: top right, the outline of Europe and its name. -->
    <a class="maps-link" href="/cartes">
      <span class="maps-link-icon" aria-hidden="true"></span>
      <span class="maps-link-text" data-text="maps.homeLink"></span>
    </a>


    <!--
      The heading is filled by script, as every sentence on this site is — it
      is empty here for the same reason the form's labels are. What is new is
      that it keeps changing, so prompt.js stacks the questions inside it and
      exposes one at a time to the accessibility tree.
    -->
    <header class="banner">
      <h1 id="prompt" class="prompt"></h1>
      <!--
        The promise, and the "?" that opens its note on the dates.

        **The slot is declared here and the lines and the "?" are placed by
        script** (`markPromise` in `home.js`): the promise is one string with
        line breaks, and the "?" follows its last full stop.

        The `data-text` stays all the same: it is what `pages.test.js` checks the
        dictionary against, and it is what shows if the enhancement above it ever
        fails — the whole promise, unmarked, which is the right thing to fall
        back to.
      -->
      <p class="tagline" id="promise" data-text="home.promise"></p>
      <!--
        The note the "?" of the promise refers to, shown on hover, focus or
        tap of that "?" (hint.js): it used to open the footer, and weighed
        on the page there. The periods covered come from /api/config.
      -->
      <p id="coverage-note" class="hint-text coverage-note" role="tooltip" hidden
        ><span id="coverage"></span><span data-text="warning.note"></span
      ></p>
    </header>

    <main>
      <!--
        A real GET form: the navigation to /resultats costs no script, the
        resulting URL is shareable, and the back button works on its own.
        Script fills lat/lon only, because the API asks for coordinates and a
        name is not one.
      -->
      <form id="search" method="get" action="/resultats" class="search">
        <div class="field">
          <label for="lieu" data-text="form.place"></label>
          <input
            type="text"
            id="lieu"
            name="lieu"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="candidates"
            data-attr-placeholder="form.placeHint"
          />
          <ul id="candidates" class="candidates" role="listbox" hidden></ul>
          <p id="chosen" class="chosen" hidden>
            <span id="chosen-name"></span>
            <button type="button" id="change" class="link" data-text="form.change"></button>
          </p>
        </div>

        <!--
          What is happening to the place field, said next to the place field.
          The count of candidates goes to the second one, which is read aloud
          and not shown: the list itself is the visible answer, and the open
          list would sit over this line anyway.
        -->
        <p id="place-status" class="status"></p>
        <p id="found" class="sr-only" aria-live="polite"></p>

        <input type="hidden" id="lat" name="lat" />
        <input type="hidden" id="lon" name="lon" />

        <!--
          Two ways of asking for a season, and neither panel showing until one
          of them is picked: by its year, or by its kind (cool, normal, warm) in
          an epoch, the year then drawn at random among those of that kind
          (kinds.js, /api/kinds).

          **Buttons, not a group of radios.** Radios only group by sharing a
          `name`, and a name is what a GET form puts in the URL: the address
          would carry a mode that means nothing to the results page. These
          carry `type="button"`, so they are never submitted and never
          accidentally submit the form either.

          Named "Période" above them, as "Lieu" names the place field: the
          group takes that line as its accessible name.
        -->
        <p id="period-label" class="field-label" data-text="form.periodLabel"></p>
        <div class="modes" role="group" aria-labelledby="period-label">
          <button
            type="button"
            id="mode-season"
            class="mode"
            aria-pressed="false"
            aria-controls="panel-season"
            data-text="form.modeSeason"
          ></button>
          <button
            type="button"
            id="mode-kind"
            class="mode"
            aria-pressed="false"
            aria-controls="panel-kind"
            data-text="form.modeKind"
          ></button>
        </div>

        <!--
          What leaves: two dates, written by either panel. The results page
          therefore needs to know nothing about seasons, kinds or epochs, and
          the URL is the same five parameters it has always been.
        -->
        <input type="hidden" id="debut" name="debut" />
        <input type="hidden" id="fin" name="fin" />
        <!-- The day the results open on, for the extreme days only: disabled,
             and so not sent, otherwise. -->
        <input type="hidden" id="jour" name="jour" disabled />
        <!-- The kind and the epoch a season was drawn from, for a search by kind
             only: the results page says them and offers another draw. -->
        <input type="hidden" id="type-tire" name="type" disabled />
        <input type="hidden" id="epoque-tiree" name="epoque" disabled />

        <!--
          Neither select carries a `name`, so neither is submitted. Both lists
          are built by script: the season names come from the dictionary, the
          years from what the API says it covers.
        -->
        <div class="dates" id="panel-season" hidden>
          <p class="field">
            <label for="saison" data-text="form.season"></label>
            <select id="saison"></select>
          </p>
          <p class="field">
            <label for="annee" data-text="form.year"></label>
            <select id="annee"></select>
          </p>
        </div>

        <!--
          A season of a kind, in an epoch. The epochs come from /api/config; the
          year is drawn on submission, once the server has ranked the seasons of
          the place.
        -->
        <div id="panel-kind" class="kind-panel" hidden>
          <div class="dates kinds">
            <p class="field">
              <label for="saison-type" data-text="form.season"></label>
              <select id="saison-type"></select>
            </p>
            <p class="field epoch">
              <label for="epoque" data-text="form.epoch"></label>
              <select id="epoque"></select>
            </p>
            <p class="field">
              <span class="label-row">
                <label for="type" data-text="form.kind"></label>
                <!-- The method, behind a "?": shown on hover, focus or tap (hint.js). -->
                <button
                  type="button"
                  class="hint"
                  data-hint
                  aria-expanded="false"
                  aria-controls="kind-note"
                  data-attr-aria-label="form.kindHint"
                >?</button>
              </span>
              <select id="type"></select>
            </p>
          </div>
          <p id="kind-note" class="hint-text" role="tooltip" data-text="form.kindNote" hidden></p>
        </div>

        <!--
          Hidden by script until a mode has been picked: left showing before,
          it would run a search on dates the visitor never saw.
        -->
        <p id="go"><button type="submit" data-text="form.submit"></button></p>

        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </main>

    <!--
      The warning, and immediately under it the place that explains it. A
      visitor who reads "simulation, pas une prévision" and wants to know what
      that means should not have to run a search first to find out.
    -->
    <footer class="banner">
      <!-- What a search gives, one click away: a visitor who has not yet typed
           a place sees the page the form leads to. Paris, summer 2075: two heat
           waves above 40 °C a month apart (26 July, 24 August), and not the
           warmest summer of the simulation on average (6th of 74). -->
      <p class="doc-link example-link">
        <a
          href="/resultats?lieu=Paris&amp;lat=48.85341&amp;lon=2.3488&amp;debut=2075-06-21&amp;fin=2075-09-20"
          data-text="home.example"
        ></a>
      </p>
      <p class="tagline" data-text="warning.noteMeaning"></p>
      <p class="doc-link">
        <a href="/documentation" data-text="site.documentation"></a>
      </p>
    </footer>
  </body>
</html>
