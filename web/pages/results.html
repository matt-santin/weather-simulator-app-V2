<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Simulator&nbsp;: résultats</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/results.js"></script>
  </head>
  <!-- The season sets the page's inks and rules (the ground is white since
       2026-10-17): results.js writes the season the range actually falls in.
       The attribute written here is the fallback, for a URL carrying no usable
       range: the summer the page was drawn on. -->
  <body class="results" data-season="summer">
    <a class="skip" href="#days" data-text="site.skipToDays"></a>

    <!-- The bar shared by the results and the map (nav.js): home, the season
         both pages show, a tab for each page carrying it. -->
    <nav class="site-nav" data-attr-aria-label="nav.label">
      <a class="site-nav-home" href="/">
        <span class="site-nav-icon" aria-hidden="true"></span>
        <span class="site-nav-name" data-text="nav.home"></span>
      </a>
      <p id="nav-context" class="site-nav-context"></p>
      <ul class="site-nav-tabs">
        <li><a id="nav-place" class="site-nav-tab" hidden></a></li>
        <li><a id="nav-map" class="site-nav-tab" data-text="nav.map" hidden></a></li>
      </ul>
    </nav>

    <header class="banner">
      <h1 id="place"></h1>
      <!-- The separator lives in the stylesheet, so a refusal — which never
           sets a count — does not leave a dangling "·" after the dates. -->
      <p class="tagline"><span id="range"></span><span id="count"></span></p>
      <p><a href="/" data-text="results.back"></a></p>
    </header>

    <main>
      <!--
        Shown only when the range reaches the future, and it carries CLAUDE.md
        rule 1 and nothing else.

        **The emissions scenario used to be a second line here.**
        `docs/science.md` requires that status stated in the interface, and it is
        stated — at length, on the documentation page, where the same paragraph
        can also say that the scenarios have not yet parted by 2050 and that the
        single model weighs more than the choice of trajectory. Four words under
        a search could carry the ranking but never that, and a caveat read as
        more alarming than it is costs the same trust as one that is missing.
        `test_pages.py` keeps the statement on the page that explains it.
      -->
      <!--
        The summary: a few figures of the dates shown beside their normal, the
        season choosing which (summary.js). First on the page: it is the frame
        the days below are read in. Filled by results.js; hidden until it is.
      -->
      <section id="summary" class="climate-section summary" hidden>
        <div class="title-row">
          <h2 id="summary-title" class="climate-title"></h2>
          <button
            type="button"
            class="hint"
            data-hint
            aria-expanded="false"
            aria-controls="summary-method"
            data-attr-aria-label="summary.hint"
          >?</button>
          <p id="summary-method" class="hint-text" role="tooltip" hidden></p>
        </div>
        <ul id="summary-figures" class="summary-figures"></ul>
        <p class="summary-more">
          <a href="#years" data-text="summary.more"></a>
          <!-- To the map of the same season, the place marked: shown by results.js
               when the server has maps and the place is in their frame. -->
          <a id="summary-map" class="summary-map" hidden data-text="summary.mapLink"></a>
        </p>
        <p id="summary-status" class="compare-note" aria-live="polite"></p>
      </section>

      <aside id="warning" class="warning" hidden>
        <p class="warning-line">
          <span data-text="warning.notAForecast"></span>
          <button
            type="button"
            class="hint"
            data-hint
            aria-expanded="false"
            aria-controls="warning-note"
            data-attr-aria-label="warning.hint"
          >?</button>
        </p>
        <p id="warning-note" class="hint-text" role="tooltip" data-text="warning.detail" hidden></p>
      </aside>

      <!--
        The way out to the long explanation, at the top and next to the warning
        it answers.

        **Outside the aside, deliberately.** That block is hidden whenever the
        range stops short of the climate model, and a link folded into it would
        vanish on every past-only search — precisely the searches whose reader
        has no warning to prompt the question and most needs the offer. Here it
        is one line under the warning when there is one, and the first line of
        the page when there is not.
      -->
      <p class="doc-link">
        <a href="/documentation" data-text="site.documentation"></a>
      </p>

      <p id="wait" class="status" aria-live="polite" data-text="results.loading"></p>
      <p id="failure" class="failure" role="alert" hidden></p>

      <!--
        The calendar: seven columns, Monday first, four weeks in view and the
        rest scrolled to. The weekday row stands outside the scrolled box so it
        stays put; it is hidden from screen readers, which hear the weekday on
        every card. The cards take the focus themselves, one in the tab order
        and the arrows for the rest (dayzoom.js). Hidden until the days arrive.
      -->
      <div id="calendar" class="calendar" hidden>
        <ol class="calendar-weekdays" aria-hidden="true">
          <li data-text="results.weekdays.0"></li>
          <li data-text="results.weekdays.1"></li>
          <li data-text="results.weekdays.2"></li>
          <li data-text="results.weekdays.3"></li>
          <li data-text="results.weekdays.4"></li>
          <li data-text="results.weekdays.5"></li>
          <li data-text="results.weekdays.6"></li>
        </ol>
        <div
          id="days-scroll"
          class="band"
          role="group"
          data-attr-aria-label="results.bandLabel"
        >
          <ol id="days" class="band-grid"></ol>
        </div>
      </div>

      <!--
        The sentence that says what the mark on the cards means, and it is built
        in results.js rather than filled from the dictionary: which of the two
        wordings applies depends on the highest level the range carries, which
        is a number nobody can write in advance. Absent entirely from a range
        that carries no mark — which is every range in France.
      -->
      <p id="humid-note" class="humid-note" hidden></p>

      <!--
        The seasonal normals: one button over the chart, and the menu of the
        reference period beside it, which also sets the grey of the climate
        diagram. On the chart's paper and against its top edge, so that it reads
        as the chart's own control. The periods and the method note come from
        the API, so results.js writes them.
      -->
      <div id="compare" class="compare-bar" hidden>
        <div class="compare-row">
          <button
            type="button"
            id="compare-toggle"
            class="toggle"
            aria-pressed="false"
            data-text="compare.open"
          ></button>
          <button
            type="button"
            class="hint"
            data-hint
            aria-expanded="false"
            aria-controls="compare-method"
            data-attr-aria-label="compare.hint"
          >?</button>
          <p class="compare-field">
            <label for="compare-reference" data-text="compare.reference"></label>
            <select id="compare-reference"></select>
          </p>
        </div>
        <p id="compare-status" class="compare-note" aria-live="polite"></p>
        <p id="compare-method" class="hint-text" role="tooltip" hidden></p>
        <p id="compare-failure" class="failure" role="alert" hidden></p>
      </div>

      <!--
        The same days again, drawn: the strip says one day at a time and never
        the shape of the period. Filled by chart.js, and hidden until it is —
        an empty frame under the cards would announce something that is not
        coming. A refused search never fills it either.
      -->
      <div id="chart-panel" class="chart-panel" hidden></div>

      <!--
        Every year from 1970 to 2100: the dates of the search in each, one tile
        per year, coloured by the anomaly to the reference period. Filled by
        results.js and matrix.js; hidden until it is.
      -->
      <section id="years" class="climate-section" hidden>
        <div class="title-row">
          <h2 id="years-title" class="climate-title"></h2>
          <button
            type="button"
            class="hint"
            data-hint
            aria-expanded="false"
            aria-controls="years-thresholds"
            data-attr-aria-label="years.hint"
          >?</button>
          <p id="years-thresholds" class="hint-text" role="tooltip" data-text="years.thresholds" hidden></p>
        </div>
        <p id="years-intro" class="compare-note"></p>
        <div id="years-grid" class="years-grid"></div>
        <ul class="climate-legend">
          <li><span class="years-scale" aria-hidden="true"></span><span data-text="years.legendCold"></span>, <span data-text="years.legendNear"></span>, <span data-text="years.legendWarm"></span></li>
          <li><span class="climate-swatch years-simulated" aria-hidden="true"></span><span data-text="years.legendSimulated"></span></li>
          <li><span class="climate-swatch years-none" aria-hidden="true"></span><span data-text="years.legendNone"></span></li>
        </ul>
        <p id="years-status" class="compare-note" aria-live="polite"></p>
        <p id="years-failure" class="failure" role="alert" hidden></p>

        <!--
          The year clicked, in a small white window over the page, anchored to
          its tile. Placed by results.js; closed by its button, Escape or a
          click elsewhere.
        -->
        <div id="years-detail" class="years-popup" role="dialog" aria-labelledby="years-heading" hidden>
          <button type="button" id="years-close" class="years-close" data-attr-aria-label="years.close"><span aria-hidden="true">×</span></button>
          <p id="years-heading" class="years-heading"></p>
          <p id="years-temperature"></p>
          <p id="years-rain"></p>
          <p id="years-simulated" class="compare-note" data-text="years.simulated" hidden></p>
          <p><a id="years-link" href="/"></a></p>
        </div>
      </section>

      <!--
        The climate diagram: twelve months over the 15 years around the year
        searched, and the reference period of the normals in grey. Filled by
        results.js and climate.js; hidden until it is.
      -->
      <section id="climate" class="climate-section" hidden>
        <div class="title-row">
          <h2 class="climate-title" data-text="climate.title"></h2>
          <button
            type="button"
            class="hint"
            data-hint
            aria-expanded="false"
            aria-controls="climate-criterion"
            data-attr-aria-label="climate.hint"
          >?</button>
          <p id="climate-criterion" class="hint-text" role="tooltip" data-text="climate.criterion" hidden></p>
        </div>
        <p id="climate-subtitle" class="compare-note"></p>
        <div id="climate-panel" class="chart-panel"></div>
        <ul class="climate-legend">
          <li><span class="climate-swatch line" aria-hidden="true"></span><span id="climate-legend-temperature"></span></li>
          <li><span class="climate-swatch bar" aria-hidden="true"></span><span id="climate-legend-rain"></span></li>
          <li><span class="climate-swatch past" aria-hidden="true"></span><span id="climate-legend-reference"></span></li>
          <li><span class="climate-swatch dry" aria-hidden="true"></span><span data-text="climate.legendDry"></span></li>
        </ul>
        <p id="climate-summary" class="compare-note"></p>
        <p id="climate-summary-reference" class="compare-note"></p>
        <p id="climate-status" class="compare-note" aria-live="polite"></p>
        <p id="climate-failure" class="failure" role="alert" hidden></p>
      </section>


      <!--
        The days on screen, as a file.

        **Outside the comparison box on purpose.** It offers what is drawn
        whether or not the normals are drawn with it, and folded into that box
        it would sit behind a control the visitor may never open.

        A button and not a link: nothing is fetched and nowhere is navigated to.
        The file is written from what the page already holds, which is also why
        it is hidden until there is something to write.
      -->
      <p id="export" class="export" hidden>
        <button
          type="button"
          id="export-button"
          class="link"
          data-text="export.button"
        ></button>
      </p>

      <details id="provenance" class="provenance" hidden>
        <summary data-text="provenance.summary"></summary>
        <dl id="provenance-grid" class="pairs"></dl>
        <p data-text="provenance.observed"></p>
      </details>
    </main>
  </body>
</html>
