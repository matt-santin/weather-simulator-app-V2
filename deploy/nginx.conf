# nginx devant uvicorn. Installé par deploy/preparer_serveur.sh dans
# /etc/nginx/sites-available/meteo2100 : DOMAINE remplacé par l'adresse
# principale du site (meteo2100.fr), REDIRIGES par les autres noms, qui
# renvoient vers elle (www.meteo2100.fr, meteo2100.eu, www.meteo2100.eu).
# Une seule adresse s'affiche ainsi dans la barre et dans les liens partagés.
# certbot (Let's Encrypt) ajoute ensuite lui-même le HTTPS aux deux blocs et la
# redirection depuis http.
#
# Limites par adresse IP. Une page de résultats demande une dizaine d'appels à
# l'API d'un coup, une carte une ou deux saisons de 2 à 4 Mo, puis une à chaque
# changement de grandeur ou de saison. Les rafales (burst) sont larges, parce
# qu'une même adresse peut porter tout un bureau ou un réseau mobile. Au-delà :
# réponse 429, sans rien calculer.
#   - API : 10 appels par seconde, rafale de 40 ;
#   - cartes (/api/map/) : 2 par seconde, rafale de 12 ;
#   - au plus 20 connexions ouvertes à la fois.
# Les fichiers statiques (pages, scripts, polices) ne sont pas limités.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cartes:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connexions:10m;

upstream meteo2100 {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    limit_conn connexions 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Le serveur compresse déjà ses réponses (GZipMiddleware) : nginx ne le
    # refait pas.
    gzip off;

    client_max_body_size 16k;   # le site ne reçoit jamais de fichier

    location /api/map/ {
        limit_req zone=cartes burst=12 nodelay;
        proxy_pass http://meteo2100;
        include /etc/nginx/snippets/meteo2100_proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://meteo2100;
        include /etc/nginx/snippets/meteo2100_proxy.conf;
    }

    location / {
        proxy_pass http://meteo2100;
        include /etc/nginx/snippets/meteo2100_proxy.conf;
    }
}

# Les autres noms : redirection permanente vers l'adresse principale, même
# chemin. Sans calcul ni limite : la réponse ne coûte rien.
server {
    listen 80;
    listen [::]:80;
    server_name REDIRIGES;
    return 301 $scheme://DOMAINE$request_uri;
}
